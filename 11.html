<style>
  body { margin: 0; padding: 0; overflow: hidden; font-family: 'Noto Sans JP', sans-serif; }
  @keyframes bounce {
    0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-10px); }
    60% { transform: translateY(-5px); }
  }
  .bounce {
    animation: bounce 2s infinite;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .hidden-content {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .visible-content {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    animation: fadeIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
</style>
</head>

<script>
  (function init() {
    const cards = [
      { guide: '#pt1-click-guide', contents: ['#pt1-text1', '#pt1-icons', '#pt1-badge'] },
      { guide: '#pt2-click-guide', contents: ['#pt2-text1', '#pt2-logo', '#pt2-badge'] },
      { guide: '#pt3-click-guide', contents: ['#pt3-text1', '#pt3-icons', '#pt3-badge'] }
    ];

    let clickCount = 0;
    const clicked = [false, false, false];

    cards.forEach((card, index) => {
      const guideEl = document.querySelector(card.guide);
      if (!guideEl) return;
      guideEl.addEventListener('click', () => {
        if (clicked[index]) return;
        clicked[index] = true;
        clickCount++;

        guideEl.style.display = 'none';

        card.contents.forEach((id, idx) => {
          const el = document.querySelector(id);
          if (el) {
            el.classList.remove('hidden-content');
            el.classList.add('visible-content');
            el.style.animationDelay = (idx * 0.15) + 's';
          }
        });

        if (clickCount === 3) {
          const bottomText = document.querySelector('#bottom-text');
          if (bottomText) {
            bottomText.classList.remove('hidden-content');
            bottomText.classList.add('visible-content');
            bottomText.style.animationDelay = '0.3s';
          }
        }
      });
    });
  })();
</script>
