<!DOCTYPE html>

<html data-theme="light" lang="ja">
<head>
<meta charset="utf-8"/>
<link data-editor-preserved="true" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&amp;display=swap" rel="stylesheet"/>
<link data-editor-preserved="true" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
<style>
  body { margin: 0; padding: 0; overflow: hidden; font-family: 'Noto Sans JP', sans-serif; }
  .slide-container { position: relative; width: 1280px; height: 720px; overflow: hidden; background-color: #F4F7FC; }
</style>
</head>
<body>
<div class="slide-container">
<div data-object="true" data-object-type="shape" id="bg-main" style="position: absolute; left: 0px; top: 0px; width: 1280px; height: 720px; background-color: rgb(244, 247, 252); z-index: 1;"></div>
<div data-object="true" data-object-type="shape" id="dec-circle1" style="position: absolute; left: 800px; top: -100px; width: 600px; height: 600px; background-color: #EAF1F9; border-radius: 50%; z-index: 1;"></div>
<div data-object="true" data-object-type="shape" id="dec-circle2" style="position: absolute; left: -150px; top: 400px; width: 500px; height: 500px; background-color: #E6EEF8; border-radius: 50%; z-index: 1;"></div>
<!-- Header -->
<div data-object="true" data-object-type="textbox" id="header-label" style="position: absolute; left: 60px; top: 30px; width: 600px; height: 30px; z-index: 10;">
<p style="font-size: 18px; color: #2F6BFF; font-weight: 800; margin: 0; text-transform: uppercase; letter-spacing: 0.1em;"><i class="fab fa-instagram" style="margin-right: 8px;"></i>Instagram Auto Post</p>
</div>
<div data-object="true" data-object-type="textbox" id="header-title" style="position: absolute; left: 60px; top: 65px; width: 600px; height: 65px; z-index: 10;">
<h1 style="font-size: 42px; color: #1E293B; font-weight: 900; margin: 0; line-height: 1.2;">①Instagram自動投稿</h1>
</div>
<!-- List of Cards -->
<div data-object="true" data-object-type="shape" id="card1-bg" style="position: absolute; left: 60px; top: 140px; width: 446px; height: 100px; background-color: #FFFFFF; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-left: 6px solid #2F6BFF; z-index: 5;"></div>
<div data-object="true" data-object-type="textbox" id="card1-icon" style="position: absolute; left: 85px; top: 160px; width: 60px; height: 60px; z-index: 10;">
<div style="width: 60px; height: 60px; background-color: #EFF6FF; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
<i class="fas fa-robot" style="font-size: 26px; color: #2F6BFF;"></i>
</div>
</div>
<div data-object="true" data-object-type="textbox" id="card1-text" style="position: absolute; left: 165px; top: 140px; width: 330px; height: 100px; z-index: 10;">
<div style="height: 100%; display: flex; align-items: center; padding: 10px 0;">
<p style="font-size: 21px; font-weight: 900; color: #1E293B; margin: 0; line-height: 1.4;">① AIが投稿内容を自動生成</p>
</div>
</div>
<div data-object="true" data-object-type="shape" id="card2-bg" style="position: absolute; left: 60px; top: 255px; width: 446px; height: 100px; background-color: #FFFFFF; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-left: 6px solid #E1306C; z-index: 5;"></div>
<div data-object="true" data-object-type="textbox" id="card2-icon" style="position: absolute; left: 85px; top: 275px; width: 60px; height: 60px; z-index: 10;">
<div style="width: 60px; height: 60px; background-color: #FDF2F5; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
<i class="far fa-clock" style="font-size: 26px; color: #E1306C;"></i>
</div>
</div>
<div data-object="true" data-object-type="textbox" id="card2-text" style="position: absolute; left: 165px; top: 255px; width: 330px; height: 100px; z-index: 10;">
<div style="height: 100%; display: flex; align-items: center; padding: 10px 0;">
<p style="font-size: 21px; font-weight: 900; color: #1E293B; margin: 0; line-height: 1.4;">② 最適な時間に自動投稿</p>
</div>
</div>
<div data-object="true" data-object-type="shape" id="card3-bg" style="position: absolute; left: 60px; top: 370px; width: 446px; height: 100px; background-color: #FFFFFF; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-left: 6px solid #10B981; z-index: 5;"></div>
<div data-object="true" data-object-type="textbox" id="card3-icon" style="position: absolute; left: 85px; top: 390px; width: 60px; height: 60px; z-index: 10;">
<div style="width: 60px; height: 60px; background-color: #ECFDF5; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
<i class="fas fa-hashtag" style="font-size: 26px; color: #10B981;"></i>
</div>
</div>
<div data-object="true" data-object-type="textbox" id="card3-text" style="position: absolute; left: 165px; top: 370px; width: 330px; height: 100px; z-index: 10;">
<div style="height: 100%; display: flex; align-items: center; padding: 10px 0;">
<p style="font-size: 21px; font-weight: 900; color: #1E293B; margin: 0; line-height: 1.4;">③ ハッシュタグ自動選定</p>
</div>
</div>
<div data-object="true" data-object-type="shape" id="card4-bg" style="position: absolute; left: 60px; top: 485px; width: 446px; height: 100px; background-color: #FFFFFF; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-left: 6px solid #F59E0B; z-index: 5;"></div>
<div data-object="true" data-object-type="textbox" id="card4-icon" style="position: absolute; left: 85px; top: 505px; width: 60px; height: 60px; z-index: 10;">
<div style="width: 60px; height: 60px; background-color: #FFFBEB; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
<i class="far fa-images" style="font-size: 26px; color: #F59E0B;"></i>
</div>
</div>
<div data-object="true" data-object-type="textbox" id="card4-text" style="position: absolute; left: 165px; top: 485px; width: 330px; height: 100px; z-index: 10;">
<div style="height: 100%; display: flex; align-items: center; padding: 10px 0;">
<p style="font-size: 21px; font-weight: 900; color: #1E293B; margin: 0; line-height: 1.4;">④ 画像・動画対応</p>
</div>
</div>
<!-- Center elements -->
<div data-object="true" data-object-type="image" id="line-screenshot" style="position: absolute; left: 540px; top: 250px; width: 170px; height: 340px; z-index: 15;">
<img alt="LINE Screenshot" src="assets/slide11-line.png" style="width: 100%; height: 100%; object-fit: contain; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);"/>
</div>
<div data-object="true" data-object-type="textbox" id="speech-bubble" style="position: absolute; left: 515px; top: 120px; width: 310px; z-index: 21; height: 110px;">
<div style="background-color: #FFFFFF; border-radius: 20px; box-shadow: 0 10px 30px rgba(47,107,255,0.15); padding: 16px; position: relative; height: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center;">
<p style="font-size: 19px; font-weight: 800; color: #2F6BFF; margin: 0; line-height: 1.5; text-align: center; white-space: nowrap;">明日の投稿予定です。<br/>ご確認ください</p>
<div style="position: absolute; right: -14px; top: 50%; transform: translateY(-50%); width: 0; height: 0; border-top: 15px solid transparent; border-bottom: 15px solid transparent; border-left: 15px solid #FFFFFF;"></div>
</div>
</div>
<!-- Right Illustration -->
<div data-object="true" data-object-type="image" id="woman-illustration" style="position: absolute; left: 700px; top: 20px; width: 580px; height: 700px; z-index: 10;">
<img alt="AI Instagram Post Illustration" src="assets/slide11-woman.png" style="width: 100%; height: 100%; object-fit: contain; object-position: center bottom;"/>
</div>
<!-- Footer/Bottom Bars -->
<div data-object="true" data-object-type="textbox" id="line-description" style="position: absolute; left: 60px; top: 615px; width: 550px; height: 70px; z-index: 22;">
<div style="background-color: #FFFFFF; padding: 0 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-left: 6px solid #06C755; box-sizing: border-box; width: 100%; height: 100%; display: flex; align-items: center; justify-content: flex-start;">
<p style="font-size: 18px; font-weight: 800; color: #1E293B; margin: 0; white-space: nowrap;"><i class="fab fa-line" style="color: #06C755; margin-right: 12px; font-size: 26px;"></i>投稿内容はLINEで確認！修正指示か承認をするだけ</p>
</div>
</div>
<div data-object="true" data-object-type="textbox" id="woman-caption" style="position: absolute; left: 640px; top: 615px; width: 580px; height: 70px; z-index: 22;">
<div style="background-color: #FFFFFF; padding: 10px 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; box-sizing: border-box; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
<p style="font-size: 28px; font-weight: 900; color: #1E293B; margin: 0; letter-spacing: 0.05em; white-space: nowrap;">投稿、分析、改善を全自動化</p>
</div>
</div>
</div>
</body>
</html>
